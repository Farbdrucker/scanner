services:
  scanme:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./docs:/app/docs
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://scanme:8000
    depends_on:
      - scanme
    restart: unless-stopped
